<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding · Fill the sentence</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--void:#14171d;--card:#262b35;--carbon:#1d2129;--sub:#9aa3b2;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0}
body{background:var(--void);color:#fff;font:16px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
.bar{background:var(--card);height:64px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;letter-spacing:-.02em}
main{max-width:680px;margin:0 auto;padding:28px 16px 48px}
.k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin-bottom:12px}
.s{font-size:clamp(28px,6.4vw,42px);line-height:1.5;font-weight:800;letter-spacing:-.02em}
.f{display:inline-block;vertical-align:baseline;position:relative}
.f select,.f input{font:800 inherit Figtree;font-size:inherit;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:0;border-bottom:3px solid var(--c);border-radius:10px 10px 0 0;padding:0 .28em;outline:none;height:1.3em;line-height:1.3;max-width:100%;-webkit-appearance:none;appearance:none;cursor:pointer;letter-spacing:-.02em}
.f select{padding-right:.2em}
.f input::placeholder{color:color-mix(in srgb,var(--c) 50%,transparent)}
.f input:focus,.f select:focus{background:color-mix(in srgb,var(--c) 26%,transparent)}
input[type=date]{width:9.6em;font-size:.8em}
.pace{width:2.6em;text-align:center}.km{width:1.6em;text-align:center}.inj{width:min(6.4em,100%)}
option{background:#1d2129;color:#fff;font-size:18px}
.preview{margin-top:36px;border-radius:28px;padding:22px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(160deg,#0b3a8a,#16264a 70%,#1b2030);transition:.4s}
.preview::after{content:"";position:absolute;right:-30px;bottom:-30px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.06)}
.preview h3{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.big{font-size:44px;font-weight:800;line-height:1.05;margin:4px 0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.stat{background:rgba(0,0,0,.25);border-radius:14px;padding:10px 12px}.stat small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.65)}.stat b{font-size:26px;font-weight:800}
.tiles{display:flex;gap:6px;margin-top:14px;position:relative;z-index:1}.tiles i{flex:1;height:8px;border-radius:9px}
.go{margin-top:20px;width:100%;height:58px;border-radius:99px;border:0;background:#e4e9f3;color:#14171d;font:800 18px Figtree;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.go:disabled{opacity:.35;cursor:not-allowed}
.note{color:var(--sub);font-size:14px;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="bar">Last Mile</div>
<main>
  <div class="k">Tell us about your race</div>
  <p class="s">
    I'm running a
    <span class="f" style="--c:#f97316"><select id="goal"><option value="">pick one</option><option>5K</option><option>10K</option><option>21K</option><option>Marathon</option><option value="Custom">my own distance</option></select></span><span id="customwrap" style="display:none"> of <span class="f" style="--c:#a070dc"><input id="km" class="km" type="number" step="0.1" placeholder="8"></span> km</span>
    on
    <span class="f" style="--c:#2f7bff"><input id="date" type="date"></span>,
    aiming for
    <span class="f" style="--c:#e0c20d"><input id="pace" class="pace" placeholder="6:30"></span>
    per km. I'm a
    <span class="f" style="--c:#58b91e"><select id="lvl"><option value="">beginner</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></span>
    runner, and I have
    <span class="f" style="--c:#a070dc"><input id="inj" class="inj" placeholder="no injury"></span>.
  </p>

  <section class="preview" id="pv">
    <h3>Your plan so far</h3>
    <div class="big" id="title">Fill in the sentence</div>
    <div class="stats">
      <div class="stat"><small>Starts</small><b>Today</b></div>
      <div class="stat"><small>Weeks</small><b id="wk">–</b></div>
      <div class="stat"><small>Goal pace</small><b id="pc">–</b></div>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <button class="go" id="go" disabled>Build my plan →</button>
  <p class="note" id="note">Pick a goal, a date and a pace to continue.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const phases=[["#4c8dff",.4],["#f97316",.3],["#ef4444",.2],["#9ca3af",.1]];
const pace=v=>{v=v.trim();return /^\d{1,2}$/.test(v)?v+":00":/^\d{1,2}:[0-5]\d$/.test(v)?v:null};
function upd(){
  const custom=$("goal").value==="Custom";
  $("customwrap").style.display=custom?"inline":"none";
  const goal=custom?($("km").value?$("km").value+" km":""):$("goal").value;
  const goalOk=goal&&(!custom||(+$("km").value>=1&&+$("km").value<=42.2));
  const d=$("date").value,days=d?Math.ceil((new Date(d+"T00:00:00")-new Date())/864e5):0;
  const p=pace($("pace").value);
  $("title").textContent=goal?`${goal}${days>0?" · "+new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"}):""}`:"Fill in the sentence";
  $("wk").textContent=days>0?Math.max(2,Math.ceil((days+1)/7)):"–";
  $("pc").textContent=p?p:"–";
  $("tiles").innerHTML=days>0?phases.map(x=>`<i style="background:${x[0]};flex:${x[1]*10}"></i>`).join(""):"";
  const ok=goalOk&&days>0&&p;
  $("go").disabled=!ok;
  $("note").textContent=ok?"Your first workout can be today.":"Pick a goal, a date and a pace to continue.";
}
["goal","km","date","pace","lvl","inj"].forEach(id=>$(id).addEventListener("input",upd));
$("go").onclick=()=>{$("go").textContent="Building your plan…";$("go").disabled=true};
upd();
</script>
</body>
</html>
